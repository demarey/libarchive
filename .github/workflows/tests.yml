name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libarchive
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev
          mkdir -p CIG/lib
          ln -sf /usr/lib/x86_64-linux-gnu/libarchive.so CIG/lib/libarchive.so

      - name: Setup Pharo
        uses: pharo-project/pharo-setup-gha@main
        with:
          version: 14

      - name: Load project
        run: |
          $PHARO --headless Pharo.image metacello \
            install "gitlocal:///${GITHUB_WORKSPACE}/src" PharoArchive \
            --save

      - name: Run tests
        run: $PHARO --headless Pharo.image test PharoArchive-Tests --fail-on-failure
